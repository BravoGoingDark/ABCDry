# ============================================================================
# pgBackRest Configuration File
# File: /etc/pgbackrest/pgbackrest.conf
# Purpose: Automated PostgreSQL backup, archiving, and disaster recovery
# ============================================================================
# pgBackRest features:
# - Parallel backup/restore
# - Incremental backup support
# - Point-in-time recovery (PITR)
# - Compression (gzip, bzip2, lz4, zstd)
# - Repository encryption
# - Backup verification
# ============================================================================

[global]
; General settings
repo1-path = /var/lib/pgbackrest  ; Local backup repository
repo1-retention-full = 30  ; Keep 30 days of full backups
repo1-retention-diff = 7   ; Keep 7 days of differential backups
repo1-type = posix  ; File system storage (or s3, azure, gcs for cloud)

; Compression settings
repo1-cipher-type = aes-256-cbc  ; Encrypt backups with AES-256
repo1-cipher-pass = BackupEncryptionPassword123  ; Change this!
compress-type = zstd  ; zstd is faster than gzip, better compression
compress-level = 3  ; 1-19, default 9. Lower = faster, higher = smaller
compress-workers = 4  ; Parallel compression workers

; Process settings
process-max = 4  ; Parallel backup workers
log-level-console = info
log-level-file = detail
log-path = /var/log/pgbackrest

; Backup verification
backup-standby = y  ; Take backups from standby to reduce primary load
check-force = n  ; Force backup even if not verified

; Timeline/WAL settings
recovery-option = recovery_target_timeline=latest
wal-compression = y  ; Compress WAL files in repository
wal-retention-type = full  ; Retain full WALs for PITR
wal-retention-days = 7  ; Keep 7 days of WAL files

; Archiving
archive-mode = on
archive-check = y  ; Verify archived segments
archive-timeout = 300  ; seconds

[stanza:agri_db]
; Stanza configuration (per database)
; A stanza is a discrete set of backup and archive sets for a cluster

; PostgreSQL settings
pg1-path = /var/lib/postgresql/14/main  ; PostgreSQL data directory for version 14
pg1-port = 5432
pg1-socket-path = /var/run/postgresql

; Backup settings for this stanza
retention-full = 30  ; Keep 30 days of full backups
retention-diff = 7   ; Keep 7 days of differential backups
retention-archive = 7  ; Keep 7 days of archived WAL files

; Database-specific compression
compress-type = zstd
compress-level = 3

; Recovery settings
recovery-option = recovery_target_timeline=latest

; Backup scheduling (cron jobs)
; Full backup: weekly on Sunday at 2 AM
; Incremental: daily at 3 AM
; Differential: daily at 2 AM (between full backups)

[stanza:agri_db_replica]
; Optional: Replica configuration for read-only backups
pg1-path = /var/lib/postgresql/14/main
pg1-port = 5432
pg1-host = replica.example.com
pg1-user = postgres

retention-full = 30
retention-diff = 7

# ============================================================================
# BACKUP SCHEDULE (Setup in crontab)
# ============================================================================
# Edit with: sudo crontab -e
#
# # Full backup every Sunday at 2:00 AM
# 0 2 * * 0 /usr/bin/pgbackrest backup --type=full --stanza=agri_db
#
# # Differential backup every weekday (Mon-Sat) at 2:00 AM
# 0 2 * * 1-6 /usr/bin/pgbackrest backup --type=diff --stanza=agri_db
#
# # Daily archive push (runs automatically, but can be triggered)
# */5 * * * * /usr/bin/pgbackrest archive-push >> /var/log/pgbackrest/cron.log 2>&1
#
# ============================================================================

# ============================================================================
# POSTGRESQL.CONF SETTINGS REQUIRED
# ============================================================================
# These settings must be configured in /etc/postgresql/14/main/postgresql.conf:
#
# # WAL (Write-Ahead Logging) for recovery
# wal_level = replica  ; At minimum (or 'logical' for logical replication)
# max_wal_senders = 10
# wal_keep_segments = 64  ; or wal_keep_size = 1GB
#
# # Archiving
# archive_mode = on
# archive_command = 'pgbackrest archive-push %p'
# archive_timeout = 300
#
# # For PITR (Point-In-Time Recovery)
# restore_command = 'pgbackrest archive-get %f "%p"'
#
# # Checkpoint settings (for faster backup)
# max_wal_size = 4GB
# checkpoint_timeout = 15min
# checkpoint_completion_target = 0.9
#
# ============================================================================

# ============================================================================
# DISASTER RECOVERY PROCEDURES
# ============================================================================
#
# 1. POINT-IN-TIME RECOVERY (PITR)
# ============================================================================
# To recover the database to a specific point in time:
#
# $ sudo systemctl stop postgresql
# $ sudo rm -rf /var/lib/postgresql/14/main/*
# $ sudo -u postgres /usr/bin/pgbackrest restore --stanza=agri_db \
#     --delta \
#     --type=time \
#     --target='2024-05-26 14:30:00'
# $ sudo systemctl start postgresql
#
# After recovery, verify:
#   SELECT * FROM agri_db;  -- Should show data from target time
#   SELECT timeline_id, archived_file FROM pg_wal_replay_progress;
#
# ============================================================================
#
# 2. FULL DATABASE RECOVERY FROM BACKUP
# ============================================================================
# To restore from a full backup:
#
# $ sudo systemctl stop postgresql
# $ sudo rm -rf /var/lib/postgresql/14/main/*
# $ sudo -u postgres /usr/bin/pgbackrest restore --stanza=agri_db --delta
# $ sudo systemctl start postgresql
#
# Verify recovery:
#   psql -U postgres -c "SELECT version();"
#   psql -d agri_db -c "SELECT COUNT(*) FROM climate_metrics;"
#
# ============================================================================
#
# 3. INCREMENTAL BACKUP RESTORE
# ============================================================================
# For faster recovery with incremental backups:
#
# $ sudo -u postgres /usr/bin/pgbackrest restore --stanza=agri_db \
#     --delta \
#     --type=xid \
#     --target='0/12345678'
#
# ============================================================================
#
# 4. VERIFY BACKUP INTEGRITY
# ============================================================================
# Before relying on backups, verify they're valid:
#
# $ sudo -u postgres /usr/bin/pgbackrest verify --stanza=agri_db
# $ sudo -u postgres /usr/bin/pgbackrest info --stanza=agri_db
#
# Expected output:
#   wal archive min/max (14-1): 000000010000000000000001/000000010000001200345678
#   backup: 20240526-023000F (full), 20240527-023000D (diff), etc.
#
# ============================================================================
#
# 5. BACKUP MONITORING & ALERTING
# ============================================================================
# Monitor backup success:
#
# $ sudo -u postgres /usr/bin/pgbackrest info --stanza=agri_db --output=json
#
# Setup alerts if backup age exceeds 7 days:
#
#   BACKUP_TIME=$(sudo -u postgres /usr/bin/pgbackrest info \
#     --stanza=agri_db --output=json | jq '.backup[0].timestamp')
#   CURRENT_TIME=$(date +%s)
#   AGE=$((CURRENT_TIME - BACKUP_TIME))
#   if [ $AGE -gt 604800 ]; then  # 7 days in seconds
#       # Send alert (email, Slack, etc.)
#       echo "Backup is more than 7 days old!" | mail -s "Backup Alert" admin@example.com
#   fi
#
# ============================================================================

# ============================================================================
# PERFORMANCE CONSIDERATIONS
# ============================================================================
#
# 1. PARALLEL BACKUPS
#    - process-max = 4 (default) spreads backup work across CPUs
#    - For large databases (100GB+), increase to 8 or more
#    - Monitor: vmstat, iostat during backup
#
# 2. COMPRESSION TRADE-OFFS
#    - zstd: Fast + good compression (recommended)
#    - lz4: Fastest but lowest compression
#    - gzip: Best compression but slowest
#    - bzip2: Balance of speed and compression
#
# 3. STORAGE PLANNING
#    - Base backup: ~90% of database size
#    - WAL archiving: ~5-10% per day (depending on write load)
#    - Plan for at least 2 weeks of backups on disk
#    - Archive older backups to S3/Azure/GCS for long-term retention
#
# 4. BACKUP FREQUENCY
#    - Full backup: Weekly (Sunday 2 AM)
#    - Differential: Daily (smaller than full, faster)
#    - Incremental: For very large databases (100GB+)
#
# ============================================================================

# ============================================================================
# MONITORING WITH GRAFANA/PROMETHEUS
# ============================================================================
#
# Export pgBackRest metrics for monitoring:
#
# $ sudo -u postgres /usr/bin/pgbackrest info --stanza=agri_db --output=json \
#   | jq '.backup | map({timestamp, type, size, databases})'
#
# Setup Prometheus scrape config:
#   - job_name: 'pgbackrest'
#     static_configs:
#       - targets: ['localhost:9144']  # pgBackRest exporter port
#
# ============================================================================
