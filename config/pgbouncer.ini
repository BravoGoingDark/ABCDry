# ============================================================================
# PgBouncer Configuration File
# File: /etc/pgbouncer/pgbouncer.ini
# Purpose: Connection pooling for PostgreSQL + TimescaleDB
# ============================================================================
# PgBouncer is a lightweight PostgreSQL connection pool that:
# - Reduces backend database connections
# - Improves response time for short queries
# - Handles concurrent dashboard requests efficiently
# ============================================================================

[databases]
; Format: database_name = host=hostname port=5432 user=username password=password
agri_db = host=localhost port=5432 user=agri_app_user password=secure_password dbname=agri_db
agri_db_replica = host=10.0.2.1 port=5432 user=agri_app_user password=secure_password dbname=agri_db

[pgbouncer]
; Connection pooling settings
pool_mode = transaction  ; transaction mode for typical web apps
; - session: one pool per connected client
; - transaction: pool per active database transaction
; - statement: pool per statement (not recommended for Django)

; Maximum number of client connections
max_client_conn = 1000

; Default pool size per database/user
default_pool_size = 25
; = total_pool_size / number_of_databases

; Minimum pool size
min_pool_size = 5

; Maximum number of server connections per pool
; (max_db_conn = default_pool_size * number_of_databases)
max_db_conn = 100

; Timeout for idle server connections
server_lifetime = 3600  ; 1 hour
server_idle_timeout = 600  ; 10 minutes
server_connect_timeout = 15  ; seconds

; Query timeout
query_timeout = 0  ; Unlimited (per-connection can be set via Django)

; Transaction idle timeout
idle_in_transaction_session_timeout = 300  ; 5 minutes

; Logging
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer.pid
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Statistics
stats_users = pgbouncer  ; User for pg_stat_pgbouncer view

; Connection string normalization
; (reduce pool pressure by normalizing identical queries)
normalize_query = 1

; Keep-alive settings
server_check_delay = 30
server_check_query = 'SELECT 1'

; Reserved pool (for admin connections)
reserve_pool_size = 5
reserve_pool_timeout = 3

; Replication setup (for read replicas)
; If using read replicas, split connections between primary and replica
; You can use pgbouncer with multiple databases (primary + replica)

; Listen on all interfaces
listen_addr = *
listen_port = 6432  ; Standard pgbouncer port

; Authentication
auth_type = md5  ; or scram-sha-256 for more security
auth_file = /etc/pgbouncer/userlist.txt
auth_query = "SELECT usename, passwd FROM pg_shadow WHERE usename = $1"

; Virtual hosts (optional - for query routing)
; admin_users = pgbouncer,postgres

; Verbose logging (debug purposes)
verbose = 0  ; Set to 1 for verbose logging

; Client idle timeout
client_idle_timeout = 900  ; 15 minutes

; Memory optimization
max_mem = 268435456  ; 256MB max memory usage

; Thread/multiplexing settings (for high-concurrency)
nbuffers = 2048  ; Number of internal buffers (default 2048)
sbuf_lookahead = 256  ; For better buffer management

; TCP settings
tcp_defer_accept = 1
tcp_keepalives = 1
tcp_keepidles = 30
tcp_keepintvls = 10
tcp_keepcnt = 5

; TLS/SSL (optional, for secure connections)
; server_tls_sslmode = allow
; client_tls_sslmode = allow
; tls_ca_file = /path/to/ca.crt
; tls_cert_file = /path/to/server.crt
; tls_key_file = /path/to/server.key

; ============================================================================
; PERFORMANCE TUNING FOR AGRICULTUREDASH
; ============================================================================
; For a typical agricultural dashboard with:
; - 10 concurrent users
; - Average query time: 100-500ms
; - Peak concurrent connections: 50-100
;
; Recommended settings:
; - pool_mode = transaction
; - default_pool_size = 25 (2.5x typical users)
; - max_client_conn = 1000 (allows spikes)
; - server_lifetime = 3600
; - server_idle_timeout = 600
;
; Monitor with:
;   SHOW POOLS;
;   SHOW CLIENTS;
;   SHOW SERVERS;
;   SHOW STATS;
;
; ============================================================================

[pgbouncer]
; Health check settings
application_name_add_host = 1
pause_mode = all

; Monitoring endpoint (for Prometheus/Grafana)
; Expose pgbouncer metrics at /metrics endpoint
; stats_period = 60  ; seconds
