{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroAI Assistant — APWRS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  body { font-family: Segoe UI, Tahoma, Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; color: #1c2430; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: #5b6773; font-size: .9rem; margin-bottom: 16px; }
  .chat { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 18px; min-height: 300px; }
  .msg { margin: 10px 0; padding: 10px 14px; border-radius: 10px; max-width: 85%; line-height: 1.5; font-size: .92rem; }
  .user { background: #e3f0ea; margin-left: auto; }
  .bot { background: #f0f2f4; }
  .meta { font-size: .72rem; color: #8a97a3; margin-top: 4px; }
  form { display: flex; gap: 8px; margin-top: 14px; }
  input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid #ccd5db; border-radius: 8px; font-size: .95rem; }
  button { background: #2e7d5b; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { background: #fff; border: 1px solid #ccd5db; border-radius: 999px; padding: 6px 12px; font-size: .8rem; cursor: pointer; }
  select { padding: 8px; border-radius: 8px; border: 1px solid #ccd5db; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .ai-head { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:#1b4332; color:#fff; border-bottom:1px solid rgba(255,255,255,.12); }
  .ai-head-main { display:flex; align-items:center; gap:9px; }.ai-avatar { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.1); display:grid; place-items:center; color:#69d4f4; position:relative; }.online-dot { position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%; background:#4ade80; border:2px solid #1b4332; }.ai-title { font-size:12px; font-weight:700; }.ai-sub { font-size:10px; color:#86af99; margin-top:2px; }.ai-actions { display:flex; align-items:center; gap:6px; }.icon-btn { width:29px; height:29px; display:grid; place-items:center; border:0; border-radius:6px; background:transparent; color:#d4e9df; padding:0; }.icon-btn:hover { background:rgba(255,255,255,.1); color:#fff; }.lang-btn { font-size:9px; font-weight:700; padding:5px 7px; background:#012d1d; border-radius:5px; color:#c1ecd4; }
  .chip { white-space:nowrap; border-radius:999px; background:#fff; font-size:10px; padding:5px 9px; }
  .composer-wrap { display:flex; align-items:center; gap:7px; }.send { width:34px; height:34px; padding:0 !important; border-radius:9px !important; }.send-symbol { font-size:18px; }
  /* Bottom composer: compact, with no external or inherited spacing. */
  #f { box-sizing: border-box; display: flex; width: 100%; height: 50px; min-height: 50px; margin: 0; padding: 5px 10px 4px; border-top: 1px solid #c1c8c2; background: #fff; }
  #f .composer-wrap { height: 40px; min-height: 40px; margin: 0; }
  #f input[type=text] { min-width: 0; height: 40px; margin: 0; padding: 0 10px; }
  #f .mic, #f .send { width: 36px; height: 36px; margin: 0; align-self: center; flex: 0 0 36px; }
  #f .attach { width: 30px; height: 34px; margin: 0; }
  body { overflow: hidden; }
  .wrap { min-height: 0; overflow: hidden; }

  [dir=rtl] { text-align: right; }
  /* AgroAI light theme: applies over the existing assistant layout */
  body { font-family: Inter, "Segoe UI", sans-serif; background: #f9f9ff; color: #151c27; margin: 0; padding: 0; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .wrap { max-width: none; width: 100%; height: 100vh; display: flex; flex-direction: column; background: #f9f9ff; }
  .card { display: contents; }
  .chat { flex: 1 1 auto; min-height: 0; height: auto; overflow-y: auto; background: #f9f9ff; }
  .note { display: none; }
  .ai-head { flex: 0 0 auto; }
  .quickbar, .bar, form { flex: 0 0 auto; }
  .wrap { max-width: 900px; }
  h1 { color: #012d1d; letter-spacing: -0.02em; }
  .sub { color: #414844; }
  .card { border: 0; border-radius: 0; box-shadow: none; }
  .chat { background: #f9f9ff; }
  .msg { font-size: 12px; line-height: 1.55; margin: 12px 0; padding: 12px; }
  .bot { background: #f0f3ff; color: #151c27; border: 1px solid #c1c8c2; border-radius: 16px 16px 4px 16px; }
  .user { background: #012d1d; color: #fff; border: 0; border-radius: 16px 16px 4px 16px; }
  .meta { color: #00677d; font-weight: 600; }
  form, .bar { background: #f0f3ff; border-color: #c1c8c2; }
  input[type=text] { background: #fff; border-color: #c1c8c2; color: #151c27; }
  input[type=text]:focus { outline: 2px solid #72ddfd; outline-offset: 1px; }
  button { background: #012d1d; color: #fff; }
  button:hover { background: #1b4332; }
  .chip { background: #e7eefe; color: #012d1d; border-color: #c1c8c2; }
  .chip:hover { background: #b2ebff; }
  select { background: #fff; color: #151c27; }
  .note { color: #414844; }
  @media (max-width: 600px) { body { padding: 0; } .chat { height: auto; } }
  .ai-head { padding:12px 16px; }.ai-avatar { width:32px; height:32px; }.ai-title { font-size:12px; }.ai-sub { font-size:10px; }
  .chat { padding:14px 14px 10px; }.msg { display:flex; gap:10px; align-items:flex-start; max-width:100%; margin:0 0 12px; padding:0; background:transparent!important; border:0!important; color:#151c27!important; }
  .msg-avatar { flex:0 0 28px; width:28px; height:28px; border-radius:50%; background:#1b4332; color:#69d4f4; display:grid; place-items:center; font-size:15px; }
  .msg-body { max-width:88%; min-width:0; }.msg.user { justify-content:flex-end; }.msg.user .msg-body { background:#012d1d; color:#fff!important; border-radius:16px 16px 4px 16px!important; padding:12px; }.msg.bot .msg-body { background:#f0f3ff; border:1px solid #c1c8c2; border-radius:16px 16px 16px 4px; padding:12px; }
  .msg-name { color:#012d1d; font-weight:700; font-size:11px; margin-bottom:5px; }.msg.user .msg-name { display:none; }.meta { font-size:10px; color:#717973; margin-top:6px; }
  .voice-panel { display:none; padding:14px 16px; background:linear-gradient(180deg,#1b4332,#e2e8f8); border-bottom:1px solid #c1c8c2; text-align:center; }.voice-panel.open { display:block; }
  .voice-wave { height:42px; display:flex; justify-content:center; align-items:center; gap:4px; }.voice-wave i { display:block; width:3px; height:12px; border-radius:2px; background:#69d4f4; animation:wave .9s infinite alternate; }.voice-wave i:nth-child(2n){animation-delay:.15s}.voice-wave i:nth-child(3n){animation-delay:.3s}@keyframes wave{to{height:36px}}
  .voice-title { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#86af99; }.voice-text { margin:9px 0; padding:8px; border-radius:8px; border:1px solid #c1c8c2; background:rgba(255,255,255,.8); color:#414844; font-size:11px; }
  .voice-actions { display:flex; justify-content:center; gap:8px; }.voice-actions button { width:auto!important; height:auto!important; padding:7px 12px!important; border-radius:999px!important; font-size:10px!important; }
  .quickbar { flex:0 0 auto; display:flex; gap:6px; overflow-x:auto; padding:8px 12px; background:rgba(240,243,255,.75); border-top:1px solid #c1c8c2; }.quickbar .chip { flex:0 0 auto; margin:0; }
  .bar { padding:7px 12px; }.bar select { font-size:10px; padding:6px; }.composer-wrap { position:relative; }.composer-wrap input { padding-right:36px!important; }.attach { position:absolute; right:31px; top:50%; transform:translateY(-50%); border:0!important; background:transparent!important; color:#00677d!important; padding:4px!important; }.mic { width:34px!important; height:34px!important; padding:0!important; flex:0 0 34px; background:#e2e8f8!important; color:#012d1d!important; }
  @media (max-width: 600px) { .chat { height: auto; } .chip { font-size: 10px; } }
</head>
<body>
<div class="wrap">
  <header class="ai-head">
    <div class="ai-head-main"><div class="ai-avatar"><span class="material-symbols-outlined" style="font-size:18px;">smart_toy</span><span class="online-dot"></span></div><div><div class="ai-title">AgroAI Assistant <span style="font-size:8px;text-transform:uppercase;background:rgba(105,212,244,.25);color:#69d4f4;padding:2px 5px;border-radius:3px;">Live</span></div><div class="ai-sub">● En ligne • Contexte bassin actif</div></div></div>
    <div class="ai-actions"><button class="icon-btn" id="ai-reset" type="button" title="Clear conversation / Recommencer"><span class="material-symbols-outlined" style="font-size:18px;">restart_alt</span></button><button class="lang-btn" id="ai-lang" type="button" title="Change language">FR | EN | AR</button><button class="icon-btn" id="ai-close" type="button" title="Close"><span class="material-symbols-outlined" style="font-size:18px;">close</span></button></div>
  </header>
  <div class="voice-panel" id="voice-panel">
    <div class="voice-title">● Mode vocal interactif</div>
    <div class="voice-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="voice-text" id="voice-text">« Microphone interface ready. Connect a speech service to enable voice input. »</div>
    <div class="voice-actions"><button type="button" id="voice-toggle">Start microphone</button><button type="button" id="voice-close">Return to text</button></div>
  </div>
  <div class="chat" id="chat">
    <div class="msg bot" id="bot-welcome"><span class="msg-avatar material-symbols-outlined">psychology</span><div class="msg-body"><div class="msg-name">AgroAI Diagnostiqueur <span style="font-weight:400;color:#717973">• ready</span></div><div>Hello. Ask me about drought risk, irrigation, crop water needs, or water-saving actions. I use the selected region and live indicators.</div></div></div>
  </div>
  <div class="bar">
    <select id="region" aria-label="Region"><option value="">Select a region</option>{% for region in regions %}<option value="{{ region.pk }}">{{ region.name }}</option>{% endfor %}</select>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select>
  </div>
  <div class="quickbar"><div class="chips" id="chips"></div></div>
  <form id="f">
    <button class="mic" id="mic-btn" type="button" aria-label="Open voice mode"><span class="material-symbols-outlined">mic</span></button>
    <div class="composer-wrap"><input type="text" id="q" placeholder="Posez une question agronomique..." autocomplete="off" required><button class="attach" type="button" aria-label="Attach field or observation" title="Attach field or observation"><span class="material-symbols-outlined">attachment</span></button></div>
    <button class="send" type="submit" aria-label="Send"><span class="material-symbols-outlined send-symbol">send</span></button>
  </form>
</div>
<script>
const chat = document.getElementById('chat');
const chips = document.getElementById('chips');
const langSel = document.getElementById('lang');
const regionSel = document.getElementById('region');
const resetBtn = document.getElementById('ai-reset');
const csrfToken = document.cookie.split('; ').find(c => c.startsWith('csrftoken='))?.split('=')[1] || '{{ csrf_token }}';

const STORAGE_KEY_MSGS = 'agroai_chat_display_messages_v1';
const STORAGE_KEY_HISTORY = 'agroai_chat_history_v1';
let chatHistory = [];
let savedMessages = [];

function saveState() {
  try {
    if (savedMessages.length > 50) savedMessages = savedMessages.slice(-50);
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
    localStorage.setItem(STORAGE_KEY_MSGS, JSON.stringify(savedMessages));
    localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(chatHistory));
  } catch (e) {}
}

function loadPersistedState() {
  try {
    const rawHistory = localStorage.getItem(STORAGE_KEY_HISTORY);
    if (rawHistory) chatHistory = JSON.parse(rawHistory) || [];
    const rawMsgs = localStorage.getItem(STORAGE_KEY_MSGS);
    if (rawMsgs) {
      savedMessages = JSON.parse(rawMsgs) || [];
      savedMessages.forEach(m => {
        addMsg(m.text, m.role === 'user' ? 'user' : 'bot', m.meta, m.sources);
      });
      if (savedMessages.length > 0) {
        chat.scrollTop = chat.scrollHeight;
      }
    }
  } catch (e) {}
}

function addMsg(text, cls, meta, sources) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (cls === 'bot') {
    const avatar = document.createElement('span');
    avatar.className = 'msg-avatar material-symbols-outlined';
    avatar.textContent = 'psychology';
    d.appendChild(avatar);
  }
  const body = document.createElement('div');
  body.className = 'msg-body';
  if (cls === 'bot') {
    const name = document.createElement('div');
    name.className = 'msg-name';
    name.textContent = 'AgroAI Diagnostiqueur';
    body.appendChild(name);
  }
  const content = document.createElement('div');
  content.textContent = text;
  body.appendChild(content);
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; body.appendChild(m); }
  if (cls === 'bot' && sources && sources.length) {
    const box = document.createElement('div');
    box.className = 'meta';
    const label = document.createElement('span');
    label.textContent = 'Sources: ';
    box.appendChild(label);
    sources.forEach((s, i) => {
      if (i) box.appendChild(document.createTextNode(' · '));
      const tag = document.createElement('span');
      tag.textContent = s.source;
      tag.title = s.title;
      box.appendChild(tag);
    });
    body.appendChild(box);
  }
  d.appendChild(body);
  if (/[\u0600-\u06FF]/.test(text)) d.dir = 'rtl';
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}

if (resetBtn) {
  resetBtn.onclick = () => {
    if (savedMessages.length > 0 && !confirm('Effacer l\'historique ? / Clear conversation?')) return;
    chatHistory = [];
    savedMessages = [];
    try {
      localStorage.removeItem(STORAGE_KEY_MSGS);
      localStorage.removeItem(STORAGE_KEY_HISTORY);
    } catch (e) {}
    const welcome = document.getElementById('bot-welcome');
    chat.innerHTML = '';
    if (welcome) chat.appendChild(welcome);
  };
}

async function loadChips() {
  const r = await fetch('/assistant/chat/?lang=' + langSel.value);
  const d = await r.json();
  chips.innerHTML = '';
  (d.suggestions || []).forEach(s => {
    const c = document.createElement('span'); c.className = 'chip'; c.textContent = s;
    c.onclick = () => { document.getElementById('q').value = s; document.getElementById('f').requestSubmit(); };
    chips.appendChild(c);
  });
}
langSel.onchange = loadChips; loadChips();

function setVoice(open) {
  document.getElementById('voice-panel').classList.toggle('open', open);
  document.getElementById('voice-toggle').textContent = open ? 'Pause microphone' : 'Start microphone';
  document.getElementById('voice-text').textContent = open
    ? '« Voice input is not connected. Type your agronomic question below. »'
    : '« Microphone interface ready. Connect a speech service to enable voice input. »';
}
const aiVoiceBtn = document.getElementById('ai-voice');
if (aiVoiceBtn) aiVoiceBtn.onclick = () => setVoice(!document.getElementById('voice-panel').classList.contains('open'));
document.getElementById('mic-btn').onclick = () => setVoice(true);
document.getElementById('voice-toggle').onclick = () => {
  const active = document.getElementById('voice-toggle').textContent === 'Pause microphone';
  setVoice(active);
};
document.getElementById('voice-close').onclick = () => setVoice(false);
document.getElementById('ai-close').onclick = () => window.parent.postMessage('agroai:close', window.location.origin);
document.getElementById('ai-lang').onclick = () => {
  const values = ['en', 'fr', 'ar'];
  langSel.value = values[(values.indexOf(langSel.value) + 1) % values.length];
  loadChips();
};

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  addMsg(q, 'user');
  savedMessages.push({ role: 'user', text: q });
  chatHistory.push({ role: 'user', content: q });
  saveState();

  document.getElementById('q').value = '';
  const think = addMsg('Analysing live indicators…', 'bot');
  chat.scrollTop = chat.scrollHeight;
  try {
    const r = await fetch('/assistant/chat/', {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
      body: JSON.stringify({
        question: q,
        lang: langSel.value,
        region_id: regionSel.value || null,
        history: chatHistory.slice(-8)
      })
    });
    const d = await r.json().catch(() => ({}));
    think.remove();
    if (!r.ok) {
      addMsg(r.status === 403 ? 'The assistant session could not be verified. Refresh the dashboard and try again.' : 'The assistant service is unavailable. Please try again shortly.', 'bot');
      return;
    }
    if (d.error) { addMsg('Error: ' + d.error, 'bot'); return; }
    const metaStr = d.facts ? (d.region + ' | risk ' + d.facts.risk_score + '/100' + (d.from_cache ? ' | instant' : '')) : '';
    addMsg(d.answer, 'bot', metaStr, d.sources);
    if (d.answer) {
      chatHistory.push({ role: 'assistant', content: d.answer });
      savedMessages.push({ role: 'assistant', text: d.answer, meta: metaStr, sources: d.sources });
      saveState();
    }
    if (d.suggestions) {
      chips.innerHTML = '';
      d.suggestions.forEach(s => { const c = document.createElement('span'); c.className='chip'; c.textContent=s;
        c.onclick = () => { document.getElementById('q').value = s; document.getElementById('f').requestSubmit(); }; chips.appendChild(c); });
    }
  } catch (err) { think.remove(); addMsg('Connection problem — check that the website server is running and try again.', 'bot'); }
};

loadPersistedState();
</script>
</body>
</html>
