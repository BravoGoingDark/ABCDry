services:
  - type: web
    name: abcdry
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn agri_dashboard.wsgi:application --workers 1 --timeout 120
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "127.0.0.1,localhost,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://abcdry-1.onrender.com,https://abcdry.onrender.com,https://*.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@abcdry.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "admin"
