services:
  - type: web
    name: abcdry
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn agri_dashboard.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "admin"
